<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium Pulse | Agentic Crowd Intelligence & Venue Command</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏟️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --cyan: #06b6d4;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --warning: #f59e0b;
            --success: #10b981;
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 10% 20%, #171c35 0%, #090d16 90%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 18px 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge-pill {
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-amber {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-red {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: pulse-border 1.5s infinite;
        }

        /* Match Selector Bar */
        .match-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 12px;
            margin-bottom: 20px;
        }

        .match-chip {
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .match-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .match-chip.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #a5b4fc;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
        }

        /* Navigation Toggles */
        .nav-toggles {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .nav-btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn.active {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Scenario Simulator Bar */
        .scenario-panel {
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-left: 4px solid var(--cyan);
        }

        .scenario-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-scenario {
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-scenario:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        /* Zones Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            padding: 22px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .zone-title span {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .zone-title h3 {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-safe { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-crowded { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

        .progress-container {
            margin-bottom: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-fill.status-safe { background: #10b981; }
        .progress-fill.status-crowded { background: #f59e0b; }
        .progress-fill.status-danger { background: #ef4444; }

        .prediction-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .prediction-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #818cf8;
            margin-bottom: 8px;
        }

        .prediction-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .recommendation {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-align: center;
        }

        .rec-ok { background: rgba(16, 185, 129, 0.12); color: #10b981; }
        .rec-avoid { background: rgba(239, 68, 68, 0.12); color: #ef4444; }

        /* SOS Console */
        .sos-section {
            border-left: 4px solid var(--danger);
            padding: 20px;
            margin-bottom: 24px;
        }

        .sos-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 860px) {
            .sos-grid { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
        }

        .sos-input-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        input[type="text"], select {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--danger-glow);
            transition: all 0.2s;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: all 0.2s;
        }

        /* LangGraph Multi-Agent Orchestrator Styles */
        .agentic-view {
            animation: fadeInDown 0.3s ease;
        }

        .workflow-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .node-card {
            padding: 16px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
        }

        .node-card.active {
            border-color: #6366f1;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 6px;
        }

        .json-inspector {
            font-family: 'JetBrains Mono', monospace;
            background: #050811;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            font-size: 12px;
            color: #38bdf8;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Admin Styles */
        .admin-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .admin-grid { grid-template-columns: 1fr; }
        }

        .quick-login-banner {
            background: rgba(99, 102, 241, 0.1);
            border: 1px dashed rgba(99, 102, 241, 0.4);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .alert-item {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
        }

        .alert-danger {
            border-left: 4px solid var(--danger);
            background: rgba(239, 68, 68, 0.06);
        }

        @keyframes pulse-border {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_URL = window.STADIUM_API_URL || (isLocal ? 'http://localhost:8000' : '');

        const MATCHES_PRESETS = [
            { id: 'ipl-dc-pbks', name: 'IPL 2026: DC vs PBKS', venue: 'Arun Jaitley Stadium, Delhi' },
            { id: 'ipl-csk-mi', name: 'IPL 2026: CSK vs MI', venue: 'Wankhede Stadium, Mumbai' },
            { id: 'ipl-rcb-kkr', name: 'IPL 2026: RCB vs KKR', venue: 'M. Chinnaswamy, Bengaluru' },
            { id: 'epl-ars-che', name: 'Premier League: Arsenal vs Chelsea', venue: 'Emirates Stadium, London' },
            { id: 'epl-mci-liv', name: 'Premier League: Man City vs Liverpool', venue: 'Etihad Stadium, Manchester' }
        ];

        function App() {
            const [viewMode, setViewMode] = useState('fan'); // 'fan', 'agentic', 'admin'
            const [activeMatchId, setActiveMatchId] = useState('ipl-dc-pbks');
            const [matchDetails, setMatchDetails] = useState({ title: 'IPL 2026: Delhi Capitals vs Punjab Kings', venue: 'Arun Jaitley Stadium, Delhi' });
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [adminKey, setAdminKey] = useState(localStorage.getItem('stadium_admin_key') || '');
            const [zones, setZones] = useState([]);
            const [density, setDensity] = useState({});
            const [predictions, setPredictions] = useState({});
            const [alerts, setAlerts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            // Inputs
            const [sosMsg, setSosMsg] = useState('');
            const [staffMsg, setStaffMsg] = useState('');
            const [selectedZone, setSelectedZone] = useState('');
            const [manualCount, setManualCount] = useState('');
            const [activeAlertSeverity, setActiveAlertSeverity] = useState('info');

            // Agentic & Semantic Pipeline States
            const [orchestrationPlan, setOrchestrationPlan] = useState(null);
            const [agentRunning, setAgentRunning] = useState(false);
            const [semanticQuery, setSemanticQuery] = useState('');
            const [semanticResults, setSemanticResults] = useState(null);
            const [showJsonInspector, setShowJsonInspector] = useState(false);

            useEffect(() => {
                if (adminKey === 'admin') {
                    setIsAdminAuth(true);
                }
            }, [adminKey]);

            const fetchData = async () => {
                try {
                    const [zRes, dRes, aRes] = await Promise.all([
                        fetch(`${API_URL}/zones`),
                        fetch(`${API_URL}/density`),
                        fetch(`${API_URL}/alerts`)
                    ]);

                    if (zRes.ok && dRes.ok) {
                        const zonesData = await zRes.json();
                        const densityData = await dRes.json();
                        const alertsData = aRes.ok ? await aRes.json() : [];

                        const normalizedZones = zonesData.map(z => ({...z, status: (z.status || 'active').toLowerCase()}));
                        setZones(normalizedZones);
                        setDensity(densityData);
                        setAlerts(alertsData);

                        // Predictions
                        const predPromises = normalizedZones.map(z => 
                            fetch(`${API_URL}/queue/prediction/${z.id}`)
                                .then(r => r.ok ? r.json() : null)
                                .catch(() => null)
                        );
                        const predResults = await Promise.all(predPromises);
                        const predMap = {};
                        predResults.forEach(p => { if (p && p.zone_id) predMap[p.zone_id] = p; });
                        setPredictions(predMap);
                        setError(null);
                    }
                } catch (err) {
                    console.warn("Backend fetch failed, using local resilience mode:", err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 4000);
                return () => clearInterval(interval);
            }, [activeMatchId]);

            // Switch match venue
            const switchMatch = async (matchId) => {
                setActiveMatchId(matchId);
                const found = MATCHES_PRESETS.find(m => m.id === matchId);
                if (found) setMatchDetails({ title: found.name, venue: found.venue });
                try {
                    await fetch(`${API_URL}/venues/switch`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ match_id: matchId })
                    });
                } catch (e) {}
                fetchData();
            };

            // Run LangGraph Multi-Agent Orchestration
            const runAgenticOrchestrator = async () => {
                setAgentRunning(true);
                try {
                    const res = await fetch(`${API_URL}/agentic/orchestrate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ match_name: matchDetails.title })
                    });
                    if (res.ok) {
                        const plan = await res.json();
                        setOrchestrationPlan(plan);
                    }
                } catch (e) {
                    console.error("Orchestrator run error:", e);
                } finally {
                    setAgentRunning(false);
                }
            };

            // Run Semantic Vector Search
            const runSemanticSearch = async (queryText) => {
                const q = queryText || semanticQuery;
                if (!q) return;
                try {
                    const res = await fetch(`${API_URL}/agentic/semantic-search?q=${encodeURIComponent(q)}`);
                    if (res.ok) {
                        const data = await res.json();
                        setSemanticResults(data);
                    }
                } catch (e) {
                    console.error("Semantic search error:", e);
                }
            };

            // Crisis Scenario Simulators
            const simulateScenario = async (type) => {
                if (type === 'halftime') {
                    // Flood food court and restrooms
                    const fZone = zones.find(z => z.name.toLowerCase().includes('food') || z.id === 'F1');
                    const rZone = zones.find(z => z.name.toLowerCase().includes('restroom') || z.id === 'R1');
                    if (fZone) await updateDensity(fZone.id, Math.round(fZone.capacity * 0.94));
                    if (rZone) await updateDensity(rZone.id, Math.round(rZone.capacity * 0.96));
                    await sendAlert("⚠️ SIMULATION: Half-Time Surge! Concessions and restrooms reaching critical 95% capacity.", "warning");
                } else if (type === 'gate_choke') {
                    const nZone = zones[0] || { id: 'N1', capacity: 5000 };
                    await updateDensity(nZone.id, Math.round(nZone.capacity * 0.92));
                    await sendAlert("🚨 SIMULATION: Turnstiles jammed at Gate 4. Ingress pulse regulation deployed.", "danger");
                } else if (type === 'medical') {
                    await sendAlert("🚨 SOS DISPATCH: Heat exhaustion reported in Stand E1. Medic Unit 3 dispatched with hydration kit.", "danger");
                    runSemanticSearch("heat stroke fan collapsed hydration medical");
                } else if (type === 'reset') {
                    zones.forEach(async z => {
                        await updateDensity(z.id, Math.round(z.capacity * 0.45));
                    });
                    await sendAlert("ℹ️ Venue telemetry normalized to safe baseline operations.", "info");
                }
                fetchData();
                runAgenticOrchestrator();
            };

            const updateZoneStatus = async (zoneId, status) => {
                try {
                    await fetch(`${API_URL}/zones/update?zone_id=${zoneId}&status=${status}`, {
                        method: 'POST',
                        headers: { 'X-Admin-Key': adminKey }
                    });
                    fetchData();
                } catch (e) {}
            };

            const updateDensity = async (zoneId, count) => {
                try {
                    await fetch(`${API_URL}/density/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey || 'admin' },
                        body: JSON.stringify({ zone_id: zoneId, current_people: count })
                    });
                } catch (e) {}
            };

            const sendAlert = async (msg, sev = 'info') => {
                try {
                    await fetch(`${API_URL}/alerts/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey || 'admin' },
                        body: JSON.stringify({ message: msg, severity: sev })
                    });
                    fetchData();
                } catch (e) {}
            };

            const sendSOS = async () => {
                if (!sosMsg) return;
                try {
                    await fetch(`${API_URL}/alerts/create`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `🚨 FAN PRIORITY SOS: ${sosMsg}`, severity: 'danger' })
                    });
                    setSosMsg('');
                    fetchData();
                    runAgenticOrchestrator();
                } catch (e) {}
            };

            const resolveAlert = async (alertId) => {
                try {
                    await fetch(`${API_URL}/alerts/resolve/${alertId}`, {
                        method: 'POST',
                        headers: { 'X-Admin-Key': adminKey }
                    });
                    fetchData();
                } catch (e) {}
            };

            const clearAlerts = async () => {
                try {
                    await fetch(`${API_URL}/alerts/clear`, {
                        method: 'DELETE',
                        headers: { 'X-Admin-Key': adminKey }
                    });
                    fetchData();
                } catch (e) {}
            };
            const getStatus = (p) => {
                if (p < 70) return 'safe';
                if (p < 85) return 'crowded';
                return 'danger';
            };

            if (loading) return (
                <div style={{height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#090d16'}}>
                    <div style={{textAlign:'center'}}>
                        <div style={{width:'48px', height:'48px', border:'4px solid #6366f1', borderTopColor:'transparent', borderRadius:'50%', animation:'spin 1s linear infinite', margin:'0 auto 18px'}}></div>
                        <h3 style={{letterSpacing:'1.5px', color:'#f8fafc', fontWeight:'700'}}>INITIALIZING STADIUM PULSE NEURAL LINK</h3>
                        <p style={{color:'#94a3b8', fontSize:'13px', marginTop:'6px'}}>Connecting to LangGraph Multi-Agent Engine & MongoDB Atlas...</p>
                    </div>
                </div>
            );

            const activeSOS = alerts.filter(a => a.severity === 'danger' && a.status === 'active');
            const totalFans = Object.values(density).reduce((acc, d) => acc + (d.current || 0), 0);

            return (
                <div className="container">
                    {activeSOS.length > 0 && <div className="emergency-overlay" style={{display:'block'}}></div>}

                    {/* Header */}
                    <header className="glass">
                        <div className="brand">
                            <h1>
                                <span>🏟️</span> STADIUM PULSE
                                <span className="badge-pill badge-live">● SUB-500MS LIVE</span>
                            </h1>
                            <p>

                                                            </div>
                                                        </div>
                                                        {a.status === 'active' && (
                                                            <button className="btn-scenario" style={{fontSize:'11px', color:'#10b981', borderColor:'#10b981'}} onClick={() => resolveAlert(a.id || i)}>
                                                                Resolve
                                                            </button>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
